<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Heart Disease Prediction System</h1>
    </header>
    <section id="description">
        <p>
            Welcome to the Heart Disease Prediction System. This application helps predict the likelihood of heart disease based on 
            various medical parameters. Please fill in the form below to get your prediction results.
        </p>
    </section>
    <div class="container">
        <h1>Heart Disease Prediction Form</h1>
        <h2>Enter Your Details</h2>
        <form id="predictionForm" action="{{ url_for('predict_page') }}" method="POST">

            <div id="inputFields">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required><br><br>

                <label for="sex">Sex:</label>
                <select id="sex" name="sex" required>
                    <option value="" disabled selected>Select your sex</option>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select><br><br>

                <label for="cp">Chest Pain Type:</label>
                <select id="cp" name="cp" required>
                    <option value="" disabled selected>Select chest pain type</option>
                    <option value="0">Typical Angina</option>
                    <option value="1">Atypical Angina</option>
                    <option value="2">Non-Anginal Pain</option>
                    <option value="3">Asymptomatic</option>
                </select><br><br>

                <label for="trestbps">Resting Blood Pressure (mm Hg):</label>
                <input type="number" id="trestbps" name="trestbps" min="50" max="250" placeholder="Enter resting blood pressure" required><br><br>

                <label for="chol">Serum Cholesterol (mg/dl):</label>
                <input type="number" id="chol" name="chol" min="100" max="600" placeholder="Enter cholesterol level" required><br><br>

                <label for="fbs">Fasting Blood Sugar &gt; 120 mg/dl:</label>
                <select id="fbs" name="fbs" required>
                    <option value="" disabled selected>Select fasting blood sugar</option>
                    <option value="1">True</option>
                    <option value="0">False</option>
                </select><br><br>

                <label for="restecg">Resting ECG Results:</label>
                <select id="restecg" name="restecg" required>
                    <option value="" disabled selected>Select ECG result</option>
                    <option value="0">Normal</option>
                    <option value="1">ST-T Wave Abnormality</option>
                    <option value="2">Left Ventricular Hypertrophy</option>
                </select><br><br>

                <label for="thalach">Maximum Heart Rate Achieved:</label>
                <input type="number" id="thalach" name="thalach" min="60" max="220" placeholder="Enter maximum heart rate" required><br><br>

                <label for="exang">Exercise-Induced Angina:</label>
                <select id="exang" name="exang" required>
                    <option value="" disabled selected>Is there angina?</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select><br><br>

                <label for="oldpeak">ST Depression Induced by Exercise:</label>
                <input type="number" step="0.1" id="oldpeak" name="oldpeak" min="0" max="10" placeholder="Enter ST depression value" required><br><br>

                <label for="slope">Slope of the Peak ST Segment:</label>
                <select id="slope" name="slope" required>
                    <option value="" disabled selected>Select slope type</option>
                    <option value="0">Upsloping</option>
                    <option value="1">Flat</option>
                    <option value="2">Downsloping</option>
                </select><br><br>

                <label for="ca">Number of Major Vessels (0-3):</label>
                <input type="number" id="ca" name="ca" min="0" max="3" placeholder="Enter number of vessels" required><br><br>

                <label for="thal">Thalassemia:</label>
                <select id="thal" name="thal" required>
                    <option value="" disabled selected>Select thalassemia type</option>
                    <option value="1">Normal</option>
                    <option value="2">Fixed Defect</option>
                    <option value="3">Reversible Defect</option>
                </select><br><br>

                <!-- Submit button -->
                <button type="submit">Predict</button>
            </div>
        </form>
        <div id="result"></div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
